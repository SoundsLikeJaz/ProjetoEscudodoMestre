apiVersion: v1
kind: Namespace
metadata:
  name: projeto-escudo-do-mestre

---
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: projeto-escudo-do-mestre
type: Opaque
stringData:
  DB_PASSWORD: "12345678"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: projeto-escudo-do-mestre
data:
  DB_NAME: escudo_do_mestre
  DB_HOST: mysql-service

---
# (2) ConfigMap com os .properties que o config-server serve (backend native).
# Os -docker.properties usam os nomes de Service deste manifesto.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-escudo-do-mestre
  namespace: projeto-escudo-do-mestre
data:
  escudo-do-mestre.properties: |
    spring.datasource.url=jdbc:mysql://mysql-service:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    server.port=8081
    eureka.client.register-with-eureka=true
    eureka.client.fetch-registry=true
    management.endpoints.web.exposure.include=refresh
    eureka.client.service-url.defaultZone=http://eureka-server-service:8761/eureka/
    spring.kafka.bootstrap-servers=kafka-service:9092
    spring.kafka.consumer.group-id=escudo-do-mestre
    spring.kafka.consumer.auto-offset-reset=earliest
    spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
    spring.kafka.consumer.properties[spring.json.value.default.type]=br.com.infnet.escudodomestre.listener.FichaEvent
    spring.kafka.consumer.properties[spring.json.use.type.headers]=false
    spring.kafka.consumer.properties[spring.json.trusted.packages]=br.com.infnet.escudodomestre.listener
    topics.ficha-criada=ficha-criada
    topics.ficha-excluida=ficha-excluida
  escudo-do-mestre-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server-service:8761/eureka/
    spring.datasource.url=jdbc:mysql://mysql-service:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    spring.kafka.bootstrap-servers=kafka-service:9092
  ficha-microservice.properties: |
    spring.datasource.url=jdbc:mysql://mysql-service:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    server.port=8082
    eureka.client.register-with-eureka=true
    eureka.client.fetch-registry=true
    management.endpoints.web.exposure.include=refresh
    eureka.client.service-url.defaultZone=http://eureka-server-service:8761/eureka/
    spring.kafka.bootstrap-servers=kafka-service:9092
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    spring.kafka.producer.properties[spring.json.type.mapping]=fichaCriada:br.com.infnet.fichamicroservice.events.FichaCriadaEvent,fichaExcluida:br.com.infnet.fichamicroservice.events.FichaExcluidaEvent
    topics.ficha-criada=ficha-criada
    topics.ficha-excluida=ficha-excluida
  ficha-microservice-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server-service:8761/eureka/
    spring.datasource.url=jdbc:mysql://mysql-service:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    spring.kafka.bootstrap-servers=kafka-service:9092
  gateway.properties: |
    server.port=8080
    eureka.client.service-url.defaultZone=http://eureka-server-service:8761/eureka/
    spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
    spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
    spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
    spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
    spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
    spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=1800
    spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
  gateway-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server-service:8761/eureka/

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql-container
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: DB_NAME
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: projeto-escudo-do-mestre
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka-container
          image: apache/kafka:4.1.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 20

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: projeto-escudo-do-mestre
spec:
  type: ClusterIP
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-server-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-server
  template:
    metadata:
      labels:
        app: eureka-server
    spec:
      containers:
        - name: eureka-server-container
          image: projetoescudodomestre-eureka-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8761
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: eureka-server-service
  namespace: projeto-escudo-do-mestre
spec:
  type: ClusterIP
  selector:
    app: eureka-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server-container
          image: projetoescudodomestre-config-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8888
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: "file:///config-escudo-do-mestre"
          volumeMounts:
            - name: config-repo
              mountPath: /config-escudo-do-mestre
          readinessProbe:
            httpGet:
              path: /escudo-do-mestre/docker
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config-repo
          configMap:
            name: config-escudo-do-mestre

---
apiVersion: v1
kind: Service
metadata:
  name: config-server-service
  namespace: projeto-escudo-do-mestre
spec:
  type: ClusterIP
  selector:
    app: config-server
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: escudo-do-mestre-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escudo-do-mestre
  template:
    metadata:
      labels:
        app: escudo-do-mestre
    spec:
      initContainers:
        - name: espera-eureka
          image: busybox:1.36
          command: ['sh','-c','until nc -z eureka-server-service 8761; do sleep 2; done']
        - name: espera-config-server
          image: busybox:1.36
          command: ['sh','-c','until nc -z config-server-service 8888; do sleep 2; done']
        - name: espera-mysql
          image: busybox:1.36
          command: ['sh','-c','until nc -z mysql-service 3306; do sleep 2; done']
        - name: espera-kafka
          image: busybox:1.36
          command: ['sh','-c','until nc -z kafka-service 9092; do sleep 2; done']
      containers:
        - name: escudo-do-mestre-container
          image: projetoescudodomestre-escudo-do-mestre:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server-service:8888"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server-service:8761/eureka/"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: escudo-do-mestre-service
  namespace: projeto-escudo-do-mestre
spec:
  type: ClusterIP
  selector:
    app: escudo-do-mestre
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ficha-microservice-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ficha-microservice
  template:
    metadata:
      labels:
        app: ficha-microservice
    spec:
      initContainers:
        - name: espera-eureka
          image: busybox:1.36
          command: ['sh','-c','until nc -z eureka-server-service 8761; do sleep 2; done']
        - name: espera-config-server
          image: busybox:1.36
          command: ['sh','-c','until nc -z config-server-service 8888; do sleep 2; done']
        - name: espera-mysql
          image: busybox:1.36
          command: ['sh','-c','until nc -z mysql-service 3306; do sleep 2; done']
        - name: espera-kafka
          image: busybox:1.36
          command: ['sh','-c','until nc -z kafka-service 9092; do sleep 2; done']
      containers:
        - name: ficha-microservice-container
          image: projetoescudodomestre-ficha-microservice:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server-service:8888"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server-service:8761/eureka/"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: ficha-microservice-service
  namespace: projeto-escudo-do-mestre
spec:
  type: ClusterIP
  selector:
    app: ficha-microservice
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: projeto-escudo-do-mestre
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      # o gateway so precisa do eureka (descoberta) e do config-server (rotas/CORS)
      initContainers:
        - name: espera-eureka
          image: busybox:1.36
          command: ['sh','-c','until nc -z eureka-server-service 8761; do sleep 2; done']
        - name: espera-config-server
          image: busybox:1.36
          command: ['sh','-c','until nc -z config-server-service 8888; do sleep 2; done']
      containers:
        - name: gateway-container
          image: projetoescudodomestre-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server-service:8888"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://eureka-server-service:8761/eureka/"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
            - name: EUREKA_INSTANCE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: projeto-escudo-do-mestre
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080