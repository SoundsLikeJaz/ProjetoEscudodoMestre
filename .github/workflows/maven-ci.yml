name: Build CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build escudo-do-mestre
        run: mvn -f escudo-do-mestre/pom.xml clean package -DskipTests

      - name: Build ficha-microservice
        run: mvn -f ficha-microservice/pom.xml clean package -DskipTests
