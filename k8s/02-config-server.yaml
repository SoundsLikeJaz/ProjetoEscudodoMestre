apiVersion: v1
kind: ConfigMap                  # guarda os arquivos .properties do config-repo
metadata:
  name: config-repo-files          # nome do ConfigMap
  namespace: escudomestre-net
data:
  escudo-do-mestre.properties: |
    spring.datasource.url=jdbc:mysql://localhost:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    
    server.port=8081
    
    eureka.client.register-with-eureka=true
    eureka.client.fetch-registry=true
    
    management.endpoints.web.exposure.include=refresh
    
    eureka.client.service-url.defaultZone = http://localhost:8761/eureka/
    
    spring.kafka.bootstrap-servers=localhost:9092
    
    spring.kafka.consumer.group-id=escudo-do-mestre
    spring.kafka.consumer.auto-offset-reset=earliest
    
    spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
    spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
    
    spring.kafka.consumer.properties[spring.json.value.default.type]=br.com.infnet.escudodomestre.listener.FichaEvent
    spring.kafka.consumer.properties[spring.json.use.type.headers]=false
    spring.kafka.consumer.properties[spring.json.trusted.packages]=br.com.infnet.escudodomestre.events
    
    topics.ficha-criada=ficha-criada
    topics.ficha-excluida=ficha-excluida
  escudo-do-mestre-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
  
    spring.datasource.url=jdbc:mysql://mysql:3306/escudo-do-mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678

    spring.kafka.bootstrap-servers=kafka:9092
  gateway.properties: |
    server.port=8080
    eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
    spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
    spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true
  gateway-docker.properties:  |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
  ficha-microservice.properties:  |
    spring.datasource.url=jdbc:mysql://localhost:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    
    server.port=8082
    
    eureka.client.register-with-eureka=true
    eureka.client.fetch-registry=true
    
    management.endpoints.web.exposure.include=refresh
    
    eureka.client.service-url.defaultZone = http://localhost:8761/eureka/
    
    spring.kafka.bootstrap-servers=localhost:9092
    
    spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
    spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
    
    spring.kafka.producer.properties[spring.json.type.mapping]=fichaCriada:br.com.infnet.fichamicroservice.events.FichaCriadaEvent,fichaExcluida:br.com.infnet.fichamicroservice.events.FichaExcluidaEvent
    
    topics.ficha-criada=ficha-criada
    topics.ficha-excluida=ficha-excluida
  ficha-microservice-docker.properties: |
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
    spring.datasource.url=jdbc:mysql://mysql:3306/escudo_do_mestre?createDatabaseIfNotExist=true
    spring.datasource.username=root
    spring.datasource.password=12345678
    spring.kafka.bootstrap-servers=kafka:9092
---
apiVersion: apps/v1            # versão da API do Kubernetes usada aqui
kind: Deployment                # mantém sempre a quantidade certa de Pods rodando
metadata:
  name: config-server            # nome do Deployment
  namespace: escudomestre-net      # em qual pasta (Namespace) ele mora
spec:
  replicas: 1                    # quantos Pods manter no ar
  selector:
    matchLabels:
      app: config-server          # diz quais Pods pertencem a este Deployment
  template:                      # o molde usado pra criar cada Pod
    metadata:
      labels:
        app: config-server        # etiqueta do Pod — precisa ser igual à de cima
    spec:
      containers:
        - name: config-server        # nome do container dentro do Pod
          image: config-server:1.0        # imagem buildada no Passo 06
          imagePullPolicy: IfNotPresent   # usa a imagem já carregada — não baixa de fora
          ports:
            - containerPort: 8888         # porta que o container escuta
          env:
            # backend "native" = le arquivos soltos do filesystem.
            # NAO use o backend git aqui: o ConfigMap monta .properties numa
            # pasta comum, sem .git, e o git backend falha com "No .git at ...".
            - name: SPRING_PROFILES_ACTIVE
              value: "native"
            - name: SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS
              value: "file:///config-repo"
          volumeMounts:                        # onde o volume abaixo aparece dentro do container
            - name: config-repo
              mountPath: /config-repo             # o ConfigMap "vira" arquivos nesta pasta
          readinessProbe:                 # so fica Ready quando SERVIR config de verdade
            httpGet:                          # TCP em 8888 responderia mesmo com o backend quebrado
              path: /CatalogoFilmes/docker
              port: 8888
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:                       # declara o volume que o volumeMounts acima usa
        - name: config-repo            # precisa ter o mesmo nome do volumeMounts
          configMap:
            name: config-repo-files      # arquivos vêm do ConfigMap definido acima
---
apiVersion: v1
kind: Service                    # cria um endereço fixo, que nunca muda
metadata:
  name: config-server              # vira o endereço: http://config-server:8888
  namespace: escudomestre-net
spec:
  selector:
    app: config-server                # envia tráfego pros Pods que tiverem essa etiqueta
  ports:
    - port: 8888                      # porta do próprio Service
      targetPort: 8888                 # porta real dentro do Pod, pra onde ele repassa